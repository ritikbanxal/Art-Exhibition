<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login" id="loginScreen" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-brand" data-site-name>Admin</div>
      <p class="login-sub">Sign in to manage the website</p>

      <label class="f">
        <span class="f-label">Password</span>
        <div class="pw-wrap">
          <input type="password" id="loginPassword" name="password" autocomplete="current-password" required autofocus />
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password">Show</button>
        </div>
      </label>
      <p class="login-error" id="loginError" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Sign in</button>
      <a class="login-back" href="/">&larr; Back to website</a>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sb-brand">
        <span data-site-name>Admin</span>
        <small>Admin panel</small>
      </div>
      <nav class="sb-nav" id="sbNav">
        <a href="#dashboard" data-section="dashboard">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </a>
        <p class="sb-group">Exhibitions</p>
        <a href="#artworks" data-section="artworks">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
          Artworks
        </a>
        <a href="#exhibitions" data-section="exhibitions">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          Exhibition Years
        </a>
        <p class="sb-group">Pages</p>
        <a href="#home" data-section="home">
          <svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
          Homepage
        </a>
        <a href="#media" data-section="media">
          <svg viewBox="0 0 24 24"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5"/></svg>
          Media Coverage
        </a>
        <a href="#faq" data-section="faq">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
          FAQ
        </a>
        <a href="#about" data-section="about">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          About Page
        </a>
        <p class="sb-group">Site</p>
        <a href="#site" data-section="site">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          Settings
        </a>
      </nav>
      <div class="sb-foot">
        <a href="/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
          View website
        </a>
        <button id="logoutBtn">
          <svg viewBox="0 0 24 24"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H3"/></svg>
          Log out
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSub"></p>
        </div>
        <div class="topbar-actions" id="topActions"></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- ============ EDIT DRAWER ============ -->
  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" data-close></div>
    <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <header class="drawer-head">
        <h2 id="drawerTitle">Edit</h2>
        <button class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="drawer-body" id="drawerBody"></div>
      <footer class="drawer-foot">
        <button class="btn btn-danger-ghost" id="drawerDelete">Delete</button>
        <span class="spacer"></span>
        <button class="btn btn-ghost" data-close>Cancel</button>
        <button class="btn btn-primary" id="drawerSave">Save</button>
      </footer>
    </section>
  </div>

  <!-- ============ CONFIRM DIALOG ============ -->
  <div class="confirm" id="confirm" hidden>
    <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
      <p id="confirmText"></p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirmNo">Cancel</button>
        <button class="btn btn-danger" id="confirmYes">Delete</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/site-config.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
