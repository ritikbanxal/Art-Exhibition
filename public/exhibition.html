<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exhibition – Art of Rikk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="exhibition.css" />
  <link rel="stylesheet" href="/preloader.css" />
  <script src="/site-config.js"></script>
</head>
<body>
  <!-- Intro animation + shutter page transitions (must stay first in <body>) -->
  <script src="/preloader.js"></script>

  <!-- Navbar is inserted here by script.js -->
  <div id="site-header"></div>

  <!-- ============ BANNER ============ -->
  <header class="page-banner ex-banner" id="exBanner">
    <div class="page-banner-overlay"></div>
    <div class="page-banner-content">
      <h1 id="pageTitle">Exhibition</h1>
      <p class="page-banner-sub" id="pageSub"></p>
    </div>
  </header>

  <!-- ============ INTRO + VISIT (over a dark image, like the original) ============ -->
  <section class="ex-intro-band" id="introBand">
    <div class="ex-intro-overlay"></div>
    <div class="ex-intro-inner">
      <div class="ex-intro-text reveal">
        <p class="ex-eyebrow" id="introEyebrow">The exhibition</p>
        <p class="ex-lead" id="introCount">Loading…</p>
        <div class="ex-intro-paras" id="introParas"></div>
        <a class="btn btn-light" href="#works">Browse the works &darr;</a>
      </div>

      <aside class="ex-visit reveal" id="visitCard" hidden>
        <h3>Visit</h3>
        <dl>
          <div id="visitWhereRow">
            <dt>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
              Location
            </dt>
            <dd><strong id="visitName"></strong><span id="visitAddress"></span></dd>
          </div>
          <div id="visitDatesRow">
            <dt>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              Dates
            </dt>
            <dd id="visitDates"></dd>
          </div>
          <div id="visitHoursRow">
            <dt>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
              Hours
            </dt>
            <dd id="visitHours"></dd>
          </div>
        </dl>
        <a class="ex-map" id="visitMap" href="#" target="_blank" rel="noopener">Map it &rarr;</a>
      </aside>
    </div>
  </section>

  <!-- ============ EXHIBITION TEXT (curatorial essay) ============ -->
  <section class="ex-essay" id="essaySection" hidden>
    <h2 class="ex-section-title reveal" id="essayTitle">Exhibition text</h2>
    <div class="ex-essay-body reveal" id="essay"></div>
  </section>

  <!-- ============ AWARDEES & FINALISTS ============ -->
  <section class="ex-works" id="works">
    <div class="ex-works-head">
      <h2 class="ex-section-title reveal" id="galleryHeading">Awardees &amp; Finalists</h2>
      <div class="ex-filters" id="filters" hidden>
        <button class="ex-chip active" data-filter="all">All works</button>
        <button class="ex-chip" data-filter="awards">Award winners</button>
      </div>
    </div>

    <div id="stillsBlock">
      <h3 class="ex-group-title">Still Images <span id="stillsCount"></span></h3>
      <div class="ex-grid" id="stillsGrid"></div>
    </div>

    <div id="videosBlock">
      <h3 class="ex-group-title">Videos &amp; Animations <span id="videosCount"></span></h3>
      <div class="ex-grid" id="videosGrid"></div>
    </div>

    <p class="ex-empty" id="emptyMsg" hidden>No artworks have been added for this year yet.</p>
  </section>

  <!-- ============ OTHER YEARS ============ -->
  <section class="ex-years" id="yearsSection" hidden>
    <p class="ex-eyebrow">Archive</p>
    <h2>Explore other years</h2>
    <div class="ex-years-list" id="yearsList"></div>
  </section>

  <!-- ============ ARTWORK POP-UP ============ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lbTitle">
    <div class="lb-backdrop" data-lb-close></div>

    <div class="lb-card">
      <button class="lb-close" data-lb-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>

      <div class="lb-media" id="lbMedia"></div>

      <aside class="lb-info">
        <div class="lb-info-body" id="lbInfo">
          <span class="lb-award" id="lbAward"></span>
          <h2 class="lb-title" id="lbTitle"></h2>
          <p class="lb-artists" id="lbArtists"></p>

          <dl class="lb-meta">
            <div id="lbDeptRow"><dt>Department</dt><dd id="lbDept"></dd></div>
            <div><dt>Exhibition</dt><dd id="lbYear"></dd></div>
            <div><dt>Medium</dt><dd id="lbType"></dd></div>
          </dl>

          <p class="lb-desc" id="lbDesc"></p>
        </div>

        <div class="lb-footer">
          <button class="lb-step" id="lbPrev" aria-label="Previous artwork">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <span class="lb-count" id="lbCount">1 / 1</span>
          <button class="lb-step" id="lbNext" aria-label="Next artwork">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      </aside>
    </div>
  </div>

  <!-- Footer is inserted here by script.js -->
  <div id="site-footer"></div>
  <script src="script.js"></script>
  <script src="exhibition.js"></script>
</body>
</html>
