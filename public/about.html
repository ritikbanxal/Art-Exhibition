<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About – The Living Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="about.css" />
  <link rel="stylesheet" href="/cursor.css" />
  <link rel="stylesheet" href="/preloader.css" />
  <script src="/site-config.js"></script>
</head>
<body>
  <!-- Intro animation + shutter page transitions (must stay first in <body>) -->
  <script src="/preloader.js"></script>

  <!-- Navbar is inserted here by script.js -->
  <div id="site-header"></div>

  <!-- All text below is filled from Admin → About Page (data/about.json) -->

  <!-- ============ BANNER ============ -->
  <header class="page-banner about-banner">
    <div class="page-banner-overlay"></div>
    <div class="page-banner-content">
      <h1 id="introTitle">About The Living Canvas</h1>
    </div>
  </header>

  <!-- ============ ABOUT ============ -->
  <section class="ab-intro ab-container">
    <p class="ab-intro-lead reveal" id="introLead"></p>
    <div class="ab-intro-body reveal" id="introBody"></div>
  </section>

  <!-- ============ STATEMENT ============ -->
  <section class="ab-statement parallax" id="statementSection">
    <div class="ab-statement-overlay"></div>
    <blockquote class="ab-statement-text reveal" id="statement"></blockquote>
  </section>

  <!-- ============ MISSION + VISION ============ -->
  <section class="ab-mv ab-container">
    <article class="ab-mv-card ab-mission reveal">
      <span class="ab-mv-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      </span>
      <h2 id="missionTitle">Our Mission</h2>
      <div id="missionBody"></div>
    </article>
    <article class="ab-mv-card ab-vision reveal">
      <span class="ab-mv-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <h2 id="visionTitle">Our Vision</h2>
      <div id="visionBody"></div>
    </article>
  </section>

  <!-- ============ OBJECTIVES ============ -->
  <section class="ab-objectives">
    <div class="ab-container">
      <h2 class="ab-section-title reveal" id="objectivesTitle">Our objectives</h2>
      <div class="ab-obj-grid" id="objectives"></div>
    </div>
  </section>

  <!-- ============ FOUNDER ============ -->
  <section class="ab-founder ab-container">
    <div class="ab-founder-card reveal">
      <div class="ab-founder-photo" id="founderPhoto" aria-hidden="true"></div>
      <h3 id="founderName"></h3>
      <p id="founderRole"></p>
    </div>
    <div class="ab-founder-text reveal">
      <h2 id="founderHeading">Meet Our Founder</h2>
      <div id="founderBody"></div>
    </div>
  </section>

  <!-- ============ FOUNDER'S MESSAGE ============ -->
  <section class="ab-message">
    <div class="ab-message-inner reveal">
      <h2 id="messageHeading">A Message from Our Founder</h2>
      <div class="ab-letter" id="messageBody"></div>
      <div class="ab-signature">
        <strong id="signature"></strong>
        <span id="signatureRole"></span>
      </div>
    </div>
  </section>

  <!-- Footer is inserted here by script.js -->
  <div id="site-footer"></div>
  <script src="script.js"></script>
  <script src="about.js"></script>
  <script src="/cursor.js"></script>
</body>
</html>
