<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAQ – The Living Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@100;200;300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="faq.css" />
  <link rel="stylesheet" href="/cursor.css" />
  <link rel="stylesheet" href="/preloader.css" />
  <script src="/site-config.js"></script>
</head>
<body>
  <!-- Intro animation + shutter page transitions (must stay first in <body>) -->
  <script src="/preloader.js"></script>

  <!-- Navbar is inserted here by script.js -->
  <div id="site-header"></div>

  <!-- ============ BANNER ============ -->
  <header class="page-banner faq-banner">
    <div class="page-banner-overlay"></div>
    <div class="page-banner-content">
      <h1>Frequently asked questions</h1>
    </div>
  </header>

  <!-- ============ FAQ ============ -->
  <section class="faq-wrap">

    <!-- Left: search + topic menu (sticks while scrolling) -->
    <aside class="faq-side">
      <label class="faq-search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="faqSearch" placeholder="Search questions…" autocomplete="off" />
      </label>

      <p class="faq-side-title">Topics</p>
      <nav class="faq-cats" id="faqCats"></nav>

      <a class="faq-side-cta" href="/contact#submit">
        <strong>Submit Your Work &rarr;</strong>
      </a>
    </aside>

    <!-- Right: the questions -->
    <div class="faq-main">
      <div class="faq-toolbar">
        <span id="faqCount">Loading…</span>
        <button class="faq-toggle-all" id="toggleAll">Expand all</button>
      </div>

      <div id="faqList"></div>

      <p class="faq-empty" id="faqEmpty" hidden></p>
    </div>
  </section>

  <!-- ============ GET IN TOUCH (text from the Contact page writing) ============ -->
  <section class="faq-cta">
    <div class="faq-cta-card">
      <div>
        <h2>Get in Touch</h2>
        <p>Whether you are interested in contributing scientific imagery, participating in our competition, exploring a collaboration or learning more about The Living Canvas, we would love to hear from you.</p>
      </div>
      <div class="faq-cta-actions">
        <a class="btn btn-solid" data-site-email-link href="mailto:livingcanvas2024@gmail.com">Email Us</a>
        <a class="btn btn-light" href="/contact">Contact Page</a>
      </div>
    </div>
  </section>

  <!-- Footer is inserted here by script.js -->
  <div id="site-footer"></div>
  <script src="script.js"></script>
  <script src="faq.js"></script>
  <script src="/cursor.js"></script>
</body>
</html>
